name: terraform workflow
on:
  # push:
  #   branches:
  #     - main2
  # pull_request:
  #   branches:
  #     - main

  workflow_dispatch:
jobs:
  codecheckout:
    name: codecheckout
    runs-on: windows-latest
    steps:
      - name: step-checkout
        uses: actions/checkout@v2.3.4

#output value referance between two steps:

  outputbetweensteps:
    name: outputbetweensteps
    runs-on: ubuntu-latest
    outputs:
      docker_version: "${{steps.out.outputs.API_VERSION}}"
    steps:
      - name: output01
        id: out
        run: echo "API_VERSION=10.2.2" >> "$GITHUB_OUTPUT" 

      - name: calling_variable
        run: |
          echo "Calling API VERSION NUMBER"
          echo "${{ steps.out.outputs.API_VERSION }}"
      
#output between jobs:
  outputbetweenjobs:
      name: joboutput
      runs-on: ubuntu-latest
      needs: ['outputbetweensteps']
      steps:
        - name: getoutputbetweenjobs
          run: |
            echo "Docker version is"
            echo "${{needs.outputbetweensteps.outputs.docker_version}}"

  terraformjob:
      name: terraformjob
      runs-on: ubuntu-latest
      steps:
      
        - name: step-checkout
          uses: actions/checkout@v2.3.4

        - name: terraform setup
          uses: hashicorp/setup-terraform@v3

        - name: terraform init
          run: terraform init
          working-directory: ./.github/workflows
          
        - name: terraform plan
          run: terraform plan
          working-directory: ./.github/workflows
          
        - name: terraform apply
          run: terraform apply -auto-approve tfplan
          working-directory: ./.github/workflows
